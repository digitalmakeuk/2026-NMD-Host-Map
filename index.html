<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Host Employers</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    :root { --sidebar-w: 460px; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    .app { display:flex; height:100vh; width:100vw; }

    .sidebar{
      width: var(--sidebar-w);
      min-width: 280px;
      border-right: 1px solid #e6e6e6;
      background:#fff;
      display:flex;
      flex-direction:column;
    }

    .topbar{ padding:14px; border-bottom:1px solid #eee; }
    .title{ font-weight:800; margin-bottom:16px; font-size:22px; }

    .controls select{
      width:100%;
      padding:10px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:14px;
      background:#fff;
    }

    .meta{
      margin-top:8px;
      font-size:12px;
      color:#666;
      display:flex;
      justify-content:space-between;
      gap:10px;
    }

    .debug{
      margin-top:8px;
      font-size:12px;
      color:#333;
      background:#f7f7f7;
      border:1px solid #e5e5e5;
      border-radius:8px;
      padding:8px;
      line-height:1.35;
    }

    .list{ overflow:auto; padding:12px; }

    .item{
      display:flex;
      gap:10px;
      padding:12px;
      border:1px solid #eee;
      border-radius:12px;
      margin-bottom:10px;
      cursor:pointer;
    }

    .item .text{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
    }

    .logo{
      width:44px;
      height:44px;
      border-radius:10px;
      object-fit:cover;
      border:1px solid #eee;
      background:#fafafa;
      flex:0 0 auto;
    }

    .name{ font-weight:700; font-size:16px; }
    .sub{ font-size:14px; color:#666; line-height:1.35rem; }

    .map{ flex:1; }
    #map{ height:100%; width:100%; }

    .details{ overflow:auto; padding:12px; display:none; }
    .details.active{ display:block; }

    .backbtn{
      border:1px solid #ddd;
      padding:8px 10px;
      font-size:18px;
      font-weight:800;
      color:#fff;
      border-radius:10px;
      background:rgb(12, 12, 136);
      cursor:pointer;
      margin-bottom:10px;
    }

    .details img{
      width:100%;
      max-height:180px;
      object-fit:cover;
      border-radius:12px;
      border:1px solid #eee;
      margin-top:10px;
      background:#fafafa;
    }

    @media (max-width: 900px) {
      .app { flex-direction:column; }
      .sidebar{
        width:100%;
        height:50%;
        border-right:none;
        border-bottom:1px solid #e6e6e6;
      }
      .map{ height:50%; }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="topbar">
        <div class="title">Open Day Hosts</div>

        <div class="controls">
          <select id="areaFilter">
            <option value="">All areas</option>
          </select>
        </div>

        <div class="meta">
          <div id="lastUpdated">Last updated: —</div>
          <div id="status">Status: idle</div>
        </div>

        <div id="debug" class="debug">Debug: waiting for data…</div>
      </div>

      <div id="list" class="list"></div>
      <div id="details" class="details"></div>
    </aside>

    <main class="map">
      <div id="map"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const GEOJSON_ENDPOINT = "./data/hosts.json";
    const POLL_MS = 30000;

    const map = L.map("map").setView([54.5, -3.0], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19
    }).addTo(map);

    let allFeatures = [];
    let geoLayer = null;
    const markerById = new Map();
    let prevView = null;

    const listEl = document.getElementById("list");
    const detailsEl = document.getElementById("details");
    const lastUpdatedEl = document.getElementById("lastUpdated");
    const statusEl = document.getElementById("status");
    const areaFilterEl = document.getElementById("areaFilter");
    const debugEl = document.getElementById("debug");

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[c]));
    }

    function cleanUrl(u) {
      const s = String(u || "").trim();
      if (!s) return "";
      return s.startsWith("http://") || s.startsWith("https://") ? s : ("https://" + s);
    }

    function norm(s) {
      return String(s || "").trim().toLowerCase();
    }

    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name) || "";
    }

    function setUrlParams(area, name) {
      const url = new URL(window.location);

      if (area) url.searchParams.set("area", area);
      else url.searchParams.delete("area");

      if (name) url.searchParams.set("name", name);
      else url.searchParams.delete("name");

      window.history.replaceState({}, "", url);
    }

    function popupHtml(p) {
      const name = esc(p.name || "");
      const address = esc([p.address, p.suite].filter(Boolean).join(", "));
      const img = p.image_url
        ? `<img src="${esc(p.image_url)}" style="max-width:240px;max-height:160px;object-fit:cover;border-radius:10px;border:1px solid #eee;margin:8px 0;display:block;background:#fafafa" onerror="this.style.display='none'">`
        : "";
      const website = p.website ? cleanUrl(p.website) : "";
      const web = website
        ? `<div style="margin-top:6px;"><a href="${esc(website)}" target="_blank" rel="noopener">Visit website</a></div>`
        : "";

      return `
        <div style="min-width:220px;">
          <div style="font-size:18px;font-weight:700;">${name}</div>
          ${img}
          ${address ? `<div style="font-size:16px;color:#666;">${address}</div>` : ``}
          ${web}
        </div>
      `;
    }

    function showList() {
      detailsEl.classList.remove("active");
      listEl.style.display = "";
      const selectedArea = (areaFilterEl.value || "").trim();
      setUrlParams(selectedArea, "");

      if (prevView) {
        map.flyTo(prevView.center, prevView.zoom, { duration: 0.6 });
      }
    }

    function showDetails(feature) {
      const p = feature.properties || {};
      const address = [p.address, p.suite].filter(Boolean).join(", ");

      listEl.style.display = "none";
      detailsEl.classList.add("active");

      detailsEl.innerHTML = `
        <button class="backbtn" type="button">← Back</button>
        <h2 style="margin:6px 0 0 0;">${esc(p.name || "")}</h2>

        ${p.image_url ? `<img src="${esc(p.image_url)}" onerror="this.style.display='none'">` : ""}

        <div style="margin-top:10px; font-size:16px; line-height:1.4;">
          ${p.area ? `<div style="margin-top:10px;"><b>Area:</b> ${esc(p.area)}</div>` : ""}
          ${address ? `<div style="margin-top:10px;"><b>Address:</b> ${esc(address)}</div>` : ""}
          ${p.county ? `<div style="margin-top:10px;"><b>County:</b> ${esc(p.county)}</div>` : ""}
          ${p.postcode ? `<div style="margin-top:10px;"><b>Postcode:</b> ${esc(p.postcode)}</div>` : ""}
          ${p.telephone ? `<div style="margin-top:10px;"><b>Telephone:</b> ${esc(p.telephone)}</div>` : ""}
          ${p.email ? `<div style="margin-top:10px;"><b>Email:</b> <a href="mailto:${esc(p.email)}">${esc(p.email)}</a></div>` : ""}
          ${p.category ? `<div style="margin-top:10px;"><b>Category:</b> ${esc(p.category)}</div>` : ""}
          ${p.website ? `<div style="margin-top:10px;"><b>Website:</b> <a href="${esc(cleanUrl(p.website))}" target="_blank" rel="noopener">${esc(p.website)}</a></div>` : ""}
          ${p.description ? `<div style="margin-top:10px;"><b>Description:</b>
${esc(p.description)}</div>` : ""}
        </div>
      `;

      detailsEl.querySelector(".backbtn").onclick = showList;
    }

    function selectFeature(f, updateUrl = true) {
      prevView = { center: map.getCenter(), zoom: map.getZoom() };
      const marker = markerById.get(f.__id);

      if (marker) {
        map.flyTo(marker.getLatLng(), 14, { duration: 0.6 });
        setTimeout(() => marker.openPopup(), 200);
      }

      if (updateUrl) {
        const p = f.properties || {};
        setUrlParams((p.area || "").trim(), (p.name || "").trim());
      }

      showDetails(f);
    }

    function render(features) {
      if (geoLayer) map.removeLayer(geoLayer);
      markerById.clear();

      geoLayer = L.geoJSON({ type: "FeatureCollection", features }, {
        pointToLayer: (f, latlng) => {
          const m = L.marker(latlng);
          m.bindPopup(popupHtml(f.properties || {}));
          m.on("click", () => selectFeature(f));
          return m;
        },
        onEachFeature: (f, layer) => markerById.set(f.__id, layer)
      }).addTo(map);

      renderList(features);
    }

    function renderList(features) {
      listEl.innerHTML = "";

      if (!features.length) {
        listEl.innerHTML = `<div style="padding:8px;color:#666;">No matches.</div>`;
        return;
      }

      for (const f of features) {
        const p = f.properties || {};
        const address = [p.address, p.suite].filter(Boolean).join(", ");

        const areaLine = p.area ? `📌 ${esc(p.area)}` : "";
        const countyLine = p.county ? `📍 ${esc(p.county)}` : "";
        const postcodeLine = p.postcode ? `🏷️ ${esc(p.postcode)}` : "";
        const telLine = p.telephone ? `📞 ${esc(p.telephone)}` : "";

        const tags = [areaLine, countyLine, postcodeLine, telLine]
          .filter(Boolean)
          .join(" &nbsp; ");

        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
          ${p.image_url ? `<img class="logo" src="${esc(p.image_url)}" onerror="this.style.display='none'">` : ""}
          <div class="text">
            <div class="name">${esc(p.name || "")}</div>
            ${address ? `<div class="sub">${esc(address)}</div>` : ""}
            ${tags ? `<div class="sub">${tags}</div>` : ""}
          </div>
        `;

        div.onclick = () => selectFeature(f);
        listEl.appendChild(div);
      }
    }

    function populateAreaDropdown() {
      const areas = [...new Set(
        allFeatures
          .map(f => String((f.properties && f.properties.area) || "").trim())
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b));

      debugEl.textContent = "Debug: " + areas.length + " areas found → " + areas.join(", ");

      areaFilterEl.innerHTML = '<option value="">All areas</option>';

      for (const area of areas) {
        const opt = document.createElement("option");
        opt.value = area;
        opt.textContent = area;
        areaFilterEl.appendChild(opt);
      }

      const preloadArea = getUrlParam("area");
      if (preloadArea) {
        areaFilterEl.value = preloadArea;
      }
    }

    function applyFilters() {
      const selectedArea = String(areaFilterEl.value || "").trim();

      const filtered = allFeatures.filter(f => {
        const area = String((f.properties && f.properties.area) || "").trim();
        if (!selectedArea) return true;
        return norm(area) === norm(selectedArea);
      });

      render(filtered);

      if (filtered.length && geoLayer) {
        map.fitBounds(geoLayer.getBounds().pad(0.12));
      }

      return filtered;
    }

    function applyUrlSelection(filteredFeatures) {
      const nameParam = getUrlParam("name").trim();
      if (!nameParam) return;

      const exact =
        filteredFeatures.find(f => norm(f.properties && f.properties.name) === norm(nameParam)) ||
        allFeatures.find(f => norm(f.properties && f.properties.name) === norm(nameParam));

      if (exact) {
        selectFeature(exact, false);
      }
    }

    async function fetchGeoJsonFresh() {
      const url = GEOJSON_ENDPOINT + (GEOJSON_ENDPOINT.includes("?") ? "&" : "?") + "t=" + Date.now();
      const res = await fetch(url, { cache: "no-store" });

      if (!res.ok) {
        const txt = await res.text().catch(() => "");
        throw new Error("Fetch failed: " + res.status + (txt ? (" | " + txt.slice(0, 120)) : ""));
      }

      return await res.json();
    }

    async function refreshData() {
      statusEl.textContent = "Status: refreshing…";

      const data = await fetchGeoJsonFresh();
      const features = Array.isArray(data.features) ? data.features : [];

      allFeatures = features.map((f, i) => {
        const p = f.properties || {};
        f.__id = (p.name || "item") + "-" + i;
        return f;
      });

      populateAreaDropdown();
      lastUpdatedEl.textContent = "Last updated: " + (data.updated_utc || new Date().toISOString()) + " UTC";

      showList();
      const filtered = applyFilters();
      applyUrlSelection(filtered);

      statusEl.textContent = "Status: updated (" + allFeatures.length + ")";
    }

    async function init() {
      try {
        await refreshData();
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Status: error";
        lastUpdatedEl.textContent = "Last updated: failed";
        debugEl.textContent = "Debug: " + err.message;
      }

      setInterval(() => {
        refreshData().catch(err => {
          console.error("Auto-refresh failed:", err);
          statusEl.textContent = "Status: error";
          debugEl.textContent = "Debug: " + err.message;
        });
      }, POLL_MS);
    }

    areaFilterEl.addEventListener("change", () => {
      showList();
      applyFilters();
      setUrlParams((areaFilterEl.value || "").trim(), "");
    });

    init();
  </script>
</body>
</html>
