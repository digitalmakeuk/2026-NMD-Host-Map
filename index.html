<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Host Employers</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    :root { --sidebar-w: 460px; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    .app { display:flex; height:100vh; width:100vw; }

    .sidebar{
      width: var(--sidebar-w);
      min-width: 280px;
      border-right: 1px solid #e6e6e6;
      background:#fff;
      display:flex;
      flex-direction:column;
    }

    .topbar{ padding:14px; border-bottom:1px solid #eee; }
    .title{ font-weight:800; margin-bottom:16px; font-size:22px; }

    .controls select{
      width:100%;
      padding:10px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:14px;
      background:#fff;
    }

    .meta{
      margin-top:8px;
      font-size:12px;
      color:#666;
      display:flex;
      justify-content:space-between;
      gap:10px;
    }

    .debug{
      margin-top:8px;
      font-size:12px;
      color:#333;
      background:#f7f7f7;
      border:1px solid #e5e5e5;
      border-radius:8px;
      padding:8px;
      line-height:1.35;
    }

    .list{ overflow:auto; padding:12px; }

    .item{
      display:flex;
      gap:10px;
      padding:12px;
      border:1px solid #eee;
      border-radius:12px;
      margin-bottom:10px;
      cursor:pointer;
    }

    .item .text{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
    }

    .logo{
      width:44px;
      height:44px;
      border-radius:10px;
      object-fit:cover;
      border:1px solid #eee;
      background:#fafafa;
      flex:0 0 auto;
    }

    .name{ font-weight:700; font-size:16px; }
    .sub{ font-size:14px; color:#666; line-height:1.35rem; }

    .map{ flex:1; }
    #map{ height:100%; width:100%; }

    .details{ overflow:auto; padding:12px; display:none; }
    .details.active{ display:block; }

    .backbtn{
      border:1px solid #ddd;
      padding:8px 10px;
      font-size:18px;
      font-weight:800;
      color:#fff;
      border-radius:10px;
      background:rgb(12, 12, 136);
      cursor:pointer;
      margin-bottom:10px;
    }

    .details img{
      width:100%;
      max-height:180px;
      object-fit:cover;
      border-radius:12px;
      border:1px solid #eee;
      margin-top:10px;
      background:#fafafa;
    }

    @media (max-width: 900px) {
      .app { flex-direction:column; }
      .sidebar{
        width:100%;
        height:50%;
        border-right:none;
        border-bottom:1px solid #e6e6e6;
      }
      .map{ height:50%; }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="topbar">
        <div class="title">Open Day Hosts</div>

        <div class="controls">
          <select id="areaFilter">
            <option value="">All areas</option>
          </select>
        </div>

        <div class="meta">
          <div id="lastUpdated">Last updated: —</div>
          <div id="status">Status: idle</div>
        </div>

        <div id="debug" class="debug">Debug: waiting for data…</div>
      </div>

      <div id="list" class="list"></div>
      <div id="details" class="details"></div>
    </aside>

    <main class="map">
      <div id="map"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const GEOJSON_ENDPOINT = "./data/hosts.json";
    const POLL_MS = 30000;

    const map = L.map("map").setView([54.5, -3.0], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19
    }).addTo(map);

    let allFeatures = [];
    let geoLayer = null;
    const markerById = new Map();
    let prevView = null;

    const listEl = document.getElementById("list");
    const detailsEl = document.getElementById("details");
    const lastUpdatedEl = document.getElementById("lastUpdated");
    const statusEl = document.getElementById("status");
    const areaFilterEl = document.getElementById("areaFilter");
    const debugEl = document.getElementById("debug");

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[c]));
    }

    function cleanUrl(u) {
      const s = String(u || "").trim();
      if (!s) return "";
      return s.startsWith("http://") || s.startsWith("https://") ? s : ("https://" + s);
    }

    function norm(s) {
      return String(s || "").trim().toLowerCase();
    }

    // ✅ NEW: Date formatting helpers
    function formatDateFull(iso) {
      const d = new Date(iso);
      return d.toLocaleString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function formatRelativeTime(iso) {
      const now = new Date();
      const then = new Date(iso);
      const diffMs = now - then;

      const seconds = Math.floor(diffMs / 1000);
      const minutes = Math.floor(diffMs / 60000);
      const hours = Math.floor(diffMs / 3600000);

      if (seconds < 60) return "Updated just now";
      if (minutes < 60) return `Updated ${minutes} min${minutes !== 1 ? "s" : ""} ago`;
      if (hours < 24) return `Updated ${hours} hour${hours !== 1 ? "s" : ""} ago`;

      return "Updated " + formatDateFull(iso);
    }

    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name) || "";
    }

    function setUrlParams(area, name) {
      const url = new URL(window.location);

      if (area) url.searchParams.set("area", area);
      else url.searchParams.delete("area");

      if (name) url.searchParams.set("name", name);
      else url.searchParams.delete("name");

      window.history.replaceState({}, "", url);
    }

    // (everything else unchanged...)

    async function refreshData() {
      statusEl.textContent = "Status: refreshing…";

      const data = await fetchGeoJsonFresh();
      const features = Array.isArray(data.features) ? data.features : [];

      allFeatures = features.map((f, i) => {
        const p = f.properties || {};
        f.__id = (p.name || "item") + "-" + i;
        return f;
      });

      populateAreaDropdown();

      // ✅ UPDATED LINE ONLY
      const updatedIso = data.updated_utc || new Date().toISOString();
      lastUpdatedEl.textContent = formatRelativeTime(updatedIso);
      lastUpdatedEl.title = formatDateFull(updatedIso);

      showList();
      const filtered = applyFilters();
      applyUrlSelection(filtered);

      statusEl.textContent = "Status: updated (" + allFeatures.length + ")";
    }

    // rest unchanged...
  </script>
</body>
</html>
